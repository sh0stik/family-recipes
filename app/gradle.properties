#Gradle
org.gradle.jvmargs=-Xmx6144M -Dkotlin.daemon.jvm.options\="-Xmx6144M"
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
#Android
android.useAndroidX=true
android.compileSdk=36
android.targetSdk=36
android.minSdk=24
agp.version=8.2.0
#Versions
kotlin.version=1.9.20
compose.version=1.7.0-alpha01
compose.wasm.version=1.6.1
org.jetbrains.compose.experimental.wasm.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
compose.compiler.version=1.5.3
#kotlin.experimental.tryK2=true
experiments.topLevelAwait=true
#Backend host (baked into AppConfig at build time by :shared generateAppConfig)
# Debug builds talk to a local backend over http (`docker compose up` at the repo root).
# Android emulator: use 10.0.2.2:8080 instead (the emulator's alias for the host machine), e.g.
#   ./gradlew :androidApp:assembleDebug -Precipe.serverHost.debug=10.0.2.2:8080
recipe.serverHost.debug=localhost:8080
# Release builds use https and REQUIRE a public host, supplied at build time:
# -Precipe.serverHost.release=api.example.com or env RECIPE_SERVER_HOST_RELEASE.
#recipe.serverHost.release=api.example.com