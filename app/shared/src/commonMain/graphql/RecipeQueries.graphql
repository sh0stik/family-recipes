# Shared selection set for recipe list/detail screens. One fragment -> one mapper,
# and every list query returns a consistent shape (incl. updatedAt for sorting).
# Fields the recipe list actually renders (title, description, photo, categories) plus what the
# client sorts and filters on. Deliberately excludes ingredients, nutrition and video links:
# fetching those for every recipe made the list query 26x slower and 37x larger than it needed to
# be (measured over LAN with 160 recipes: 5.52s / 514KB, versus 0.21s / 14KB for id+name alone).
# Detail screens use RecipeCard below, where the full data is genuinely displayed.
fragment RecipeListCard on Recipe {
    id
    name
    description
    visibility
    isTrashed
    # Whoever may change what the recipe says: the owner, its editors, and an admin on a family
    # recipe. Gates the edit controls and notes.
    canEdit
    # The owner, or an admin on a family recipe. Gates delete, visibility and "who can edit".
    canManage
    # Only for whoever canManage: an admin took the recipe out of view, with their reason.
    removedByAdmin
    removalReason
    createdAt
    updatedAt
    user {
        id
        username
        preferredLocale
    }
    categories {
        id
        name
    }
    photoUrls
}

fragment RecipeCard on Recipe {
    id
    name
    description
    visibility
    isTrashed
    # Whoever may change what the recipe says: the owner, its editors, and an admin on a family
    # recipe. Gates the edit controls and notes.
    canEdit
    # The owner, or an admin on a family recipe. Gates delete, visibility and "who can edit".
    canManage
    # Only for whoever canManage: an admin took the recipe out of view, with their reason.
    removedByAdmin
    removalReason
    createdAt
    updatedAt
    user {
        id
        username
        preferredLocale
    }
    ingredients {
        id
        quantity
        unit {
            id
            name
            abbreviation
            type
        }
        ingredient {
            id
            name
            caloriesPer100g
            proteinPer100g
            fatPer100g
            carbsPer100g
        }
    }
    categories {
        id
        name
    }
    photoUrls
    videoLinks
    nutrition {
        caloriesPer100g
        proteinPer100g
        fatPer100g
        carbsPer100g
        totalWeight
    }
}

query GetRecipes {
    recipes {
        ...RecipeListCard
    }
}

query MyRecipes {
    myRecipes {
        ...RecipeListCard
    }
}

query SharedWithMeRecipes {
    sharedWithMeRecipes {
        ...RecipeListCard
    }
}

query GetPublicRecipes {
    publicRecipes {
        ...RecipeListCard
    }
}

query SearchRecipes($keyword: String, $categoryId: ID, $ingredientName: String) {
    searchRecipes(keyword: $keyword, categoryId: $categoryId, ingredientName: $ingredientName) {
        ...RecipeListCard
    }
}

query GetRecipe($id: ID!) {
    recipe(id: $id) {
        ...RecipeCard
        copiedFromId
        sharedWith {
            id
            username
        }
        notes {
            id
            note
            createdAt
            user {
                id
                username
            }
        }
    }
}

query GetMe {
    me {
        id
        username
        email
        isAdmin
        preferredLocale
    }
}

query GetTrashedRecipes {
    trashedRecipes {
        id
        name
        description
        isTrashed
        createdAt
        user {
            id
            username
        }
    }
}

query GetUsers {
    users {
        id
        username
    }
}

query GetBlockedUsers {
    blockedUsers {
        id
        username
    }
}
