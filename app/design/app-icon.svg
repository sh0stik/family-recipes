<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Mom's Recipes app icon, ANDROID version: a whole two-tier cake with a cherry, on the
       app's teal. Source for the launcher mipmaps (square and round); regenerate them with
       design/make-icons.sh. iOS and web use app-icon-large.svg, the same cake drawn bigger.
       Full-bleed square, no rounded corners (the launcher masks it). The artwork stays within
       about 40 of the 50-unit radius (80%): the Pixel launcher crops a round icon tighter than
       the PNG's own circle and cuts off anything nearer the edge.
       Colours are the app's: primary #7AC5C1, sugar #FBF5E9, pinkLight #F9B7B6, red #CF252F. -->
  <rect width="100" height="100" fill="#7AC5C1"/>
  <g transform="translate(50 50) scale(0.88) translate(-50 -50)">
    <!-- plate -->
    <rect x="19" y="79" width="62" height="5" rx="2.5" fill="#FFFFFF"/>
    <!-- bottom tier -->
    <rect x="22" y="54" width="56" height="26" rx="4" fill="#FBF5E9"/>
    <rect x="22" y="68" width="56" height="4" fill="#F0B86A"/>
    <path d="M22 60 v-2 a4 4 0 0 1 4 -4 h48 a4 4 0 0 1 4 4 v6 q-4 5 -8 0 q-4.5 6 -9 0 q-5 7 -10 0 q-5 5 -10 0 q-5 6 -10 0 q-4.5 4 -9 0 z" fill="#F9B7B6"/>
    <!-- top tier -->
    <rect x="32" y="34" width="36" height="21" rx="4" fill="#FBF5E9"/>
    <path d="M32 40 v-2 a4 4 0 0 1 4 -4 h28 a4 4 0 0 1 4 4 v5 q-4.5 5 -9 0 q-4.5 6 -9 0 q-4.5 5 -9 0 q-4.5 6 -9 0 z" fill="#F9B7B6"/>
    <!-- cherry -->
    <path d="M50 23 q2 -6 8 -7.5" fill="none" stroke="#0F1E31" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="50" cy="27" r="6.5" fill="#CF252F"/>
    <circle cx="48" cy="25" r="1.6" fill="#FFFFFF" opacity=".7"/>
  </g>
</svg>
