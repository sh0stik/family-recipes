# Local demo stack: PostgreSQL + the Spring Boot backend, preloaded with a demo account and
# 7 English recipes with photos.
#
#   docker compose up --build      # first start builds the backend image (a few minutes)
#   open http://127.0.0.1:8080/actuator/health
#
# Demo login: demo / demo-password-123 (local only). Every value below has a local default;
# copy .env.example to .env to change them. Nothing here is meant for a public deployment.

services:
  postgres:
    # Pinned: a major upgrade needs a dump/restore, not just a new tag.
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=${DB_NAME:-recipes}'
      - 'POSTGRES_USER=${DB_USERNAME:-recipes}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-demo-db-password}'
    volumes:
      # postgres:18 declares its VOLUME at /var/lib/postgresql (PGDATA is a version subfolder);
      # mounting the named volume anywhere else would leave the data in an anonymous volume.
      - postgres-data:/var/lib/postgresql
      # Runs once, on the first start with an empty volume: schema + demo data.
      - ./demo/initdb:/docker-entrypoint-initdb.d:ro
    # No `ports:`. Postgres lives only on the internal `db` network, shared with the backend.
    networks:
      - db
    healthcheck:
      # Over TCP on purpose: during first-start initialisation Postgres listens on the Unix socket
      # only, so the backend waits until the demo data is fully loaded.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    # The entrypoint starts as root to chown the data directory, so no cap_drop here.
    security_opt:
      - 'no-new-privileges:true'

  # One-shot: copies the demo photos into the `uploads` volume (never overwriting) and hands the
  # folder to the backend's uid. New photos uploaded through the app land in the same volume.
  uploads-init:
    image: 'alpine:3.20'
    command: ['sh', '-c', 'cp -n /seed/*.jpg /uploads/ && chown -R 10001:10001 /uploads']
    volumes:
      - ./demo/uploads:/seed:ro
      - uploads:/uploads
    network_mode: none
    restart: 'no'

  backend:
    build: ./backend
    environment:
      - 'SPRING_PROFILES_ACTIVE=prod'
      # Required with mem_limit: bounds the heap so the JVM throws OutOfMemoryError instead of
      # being OOM-killed by the kernel.
      - 'JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70'
      - 'DB_NAME=${DB_NAME:-recipes}'
      - 'DB_USERNAME=${DB_USERNAME:-recipes}'
      - 'DB_PASSWORD=${DB_PASSWORD:-demo-db-password}'
      # Local demo key only (base64 of "local-demo-jwt-key-not-a-secret-replace-me"). Generate your
      # own with `openssl rand -base64 48` for anything beyond localhost.
      - 'JWT_SECRET_KEY=${JWT_SECRET_KEY:-bG9jYWwtZGVtby1qd3Qta2V5LW5vdC1hLXNlY3JldC1yZXBsYWNlLW1l}'
      # Shared code required to create an account.
      - 'RECIPE_INVITE_CODE=${RECIPE_INVITE_CODE:-demo-invite}'
      - 'RECIPE_ADMINS=${RECIPE_ADMINS:-family}'
      - 'RECIPE_FAMILY_ACCOUNT=${RECIPE_FAMILY_ACCOUNT:-family}'
      # Browser origins allowed to call the API: the web app's Gradle dev server.
      - 'RECIPE_CORS_ALLOWED_ORIGINS=${RECIPE_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}'
      # Mail: no SMTP server is needed. Password-reset and report emails are sent asynchronously
      # and a failed send is only logged. Point MAIL_HOST at a real server to try them.
      - 'MAIL_HOST=${MAIL_HOST:-localhost}'
      - 'MAIL_PORT=${MAIL_PORT:-587}'
      - 'EMAIL_USERNAME=${EMAIL_USERNAME:-no-reply@example.com}'
      - 'EMAIL_PASSWORD=${EMAIL_PASSWORD:-unused}'
      - 'RECIPE_REPORT_EMAIL=${RECIPE_REPORT_EMAIL:-reports@example.com}'
      - 'MANAGEMENT_HEALTH_MAIL_ENABLED=false'
      # The demo SQL already contains the reference data, so the backend's seed scripts stay off.
      - 'SQL_INIT_MODE=never'
      - 'GRAPHIQL_ENABLED=${GRAPHIQL_ENABLED:-false}'
    ports:
      # Loopback only: reachable from this machine (and the Android emulator via 10.0.2.2).
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    volumes:
      - uploads:/app/uploads
    networks:
      - default
      - db
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Hardening: uid 10001 (see Dockerfile), read-only root filesystem, no Linux capabilities,
    # no privilege escalation, bounded memory and process count.
    read_only: true
    tmpfs:
      # Tomcat's multipart work dir, ImageIO's cache while a photo is re-encoded, JVM hsperfdata.
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 1g

networks:
  # Internal: no route to the outside world. Only postgres and the backend are attached.
  db:
    internal: true

volumes:
  postgres-data:
  uploads:
